<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão Glam - Gestão e Aplicativo</title>
    <!-- Tailwind CSS para um design limpo e sem poluição visual -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo elegante personalizado para o topo */
        .logo-elegante {
            font-family: 'Playfair Display', Georgia, serif;
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Cabeçalho Principal -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold logo-elegante">Glam</h1>
            <nav class="space-x-4">
                <button onclick="mudarAba('produtos')" class="text-gray-600 hover:text-pink-600 font-medium">Produtos</button>
                <button onclick="mudarAba('servicos')" class="text-gray-600 hover:text-pink-600 font-medium">Serviços</button>
                <button onclick="mudarAba('aniversariantes')" class="text-gray-600 hover:text-pink-600 font-medium">Meus Aniversariantes</button>
                <button onclick="mudarAba('admin')" class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700 transition">Painel Admin</button>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- ABA DE PRODUTOS -->
        <section id="aba-produtos" class="secao-aba">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Catálogo de Produtos (Taxa de entrega aplicada no checkout)</h2>
            </div>
            <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

        <!-- ABA DE SERVIÇOS -->
        <section id="aba-servicos" class="secao-aba hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Catálogo de Serviços</h2>
            </div>
            <div id="grid-servicos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>

        <!-- ABA DE ANIVERSARIANTES (CLIENTE) -->
        <section id="aba-aniversariantes" class="secao-aba hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Cadastrar Amigo ou Familiar Aniversariante</h2>
                <form id="form-aniversariante" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <input type="text" id="aniv-nome" placeholder="Nome do Aniversariante" required class="border p-2 rounded-lg">
                    <input type="date" id="aniv-data" required class="border p-2 rounded-lg">
                    <button type="submit" class="bg-pink-600 text-white p-2 rounded-lg hover:bg-pink-700 transition">Salvar e Programar Presente</button>
                </form>
            </div>
            <h3 class="text-lg font-bold mb-4">Aniversariantes Cadastrados e Kits Sugeridos</h3>
            <div id="lista-aniversariantes" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dinâmico -->
            </div>
        </section>

        <!-- ABA PAINEL ADMINISTRADOR (Inserir, Editar, Excluir) -->
        <section id="aba-admin" class="secao-aba hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Painel Administrativo: Adicionar / Editar Item</h2>
                <form id="form-admin" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="hidden" id="item-id">
                    <select id="item-tipo" class="border p-2 rounded-lg">
                        <option value="produto">Produto</option>
                        <option value="servico">Serviço</option>
                    </select>
                    <input type="text" id="item-nome" placeholder="Nome do Produto/Serviço" required class="border p-2 rounded-lg">
                    <input type="number" step="0.01" id="item-preco" placeholder="Preço (R$)" required class="border p-2 rounded-lg">
                    <input type="text" id="item-foto" placeholder="URL da Foto (Ex: https://...)" required class="border p-2 rounded-lg">
                    <button type="submit" class="col-span-full bg-green-600 text-white p-2 rounded-lg hover:bg-green-700 transition">Salvar Item no Sistema</button>
                </form>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h3 class="font-bold text-lg mb-2">Gerenciar Produtos</h3>
                    <div id="admin-lista-produtos" class="space-y-2"></div>
                </div>
                <div>
                    <h3 class="font-bold text-lg mb-2">Gerenciar Serviços</h3>
                    <div id="admin-lista-servicos" class="space-y-2"></div>
                </div>
            </div>
        </section>

    </main>

        let aniversariantes = [];

        function mudarAba(idAba) {
            document.querySelectorAll('.secao-aba').forEach(el => el.classList.add('hidden'));
            document.getElementById('aba-' + idAba).classList.remove('hidden');
            renderizarTudo();
        }

        function renderizarTudo() {
            const gridP = document.getElementById('grid-produtos');
            gridP.innerHTML = produtos.map(p => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between">
                    <img src="${p.foto}" alt="${p.nome}" class="w-full h-40 object-cover rounded-lg mb-3">
                    <div>
                        <h4 class="font-bold text-gray-800">${p.nome}</h4>
                        <p class="text-pink-600 font-semibold mt-1">R$ ${p.preco.toFixed(2)}</p>
                    </div>
                    <button onclick="comprarItem('${p.nome}', ${p.preco})" class="mt-4 bg-pink-600 text-white py-2 rounded-lg hover:bg-pink-700 text-sm">Comprar (+ Taxa)</button>
                </div>
            `).join('');

            const gridS = document.getElementById('grid-servicos');
            gridS.innerHTML = servicos.map(s => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between">
                    <img src="${s.foto}" alt="${s.nome}" class="w-full h-40 object-cover rounded-lg mb-3">
                    <div>
                        <h4 class="font-bold text-gray-800">${s.nome}</h4>
                        <p class="text-pink-600 font-semibold mt-1">R$ ${s.preco.toFixed(2)}</p>
                    </div>
                    <button onclick="agendarServico('${s.nome}')" class="mt-4 bg-gray-800 text-white py-2 rounded-lg hover:bg-gray-900 text-sm">Agendar</button>
                </div>
            `).join('');

            const listaA = document.getElementById('lista-aniversariantes');
            listaA.innerHTML = aniversariantes.length === 0 ? `<p class="text-gray-500">Nenhum aniversariante cadastrado ainda.</p>` : aniversariantes.map((a, index) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                    <div>
                        <h4 class="font-bold">${a.nome}</h4>
                        <p class="text-sm text-gray-500">Data: ${a.data}</p>
                        <p class="text-xs text-pink-600 mt-1 font-medium">💡 Sugestão de Kit Presente Pronta Programada!</p>
                    </div>
                    <button onclick="programarPresente('${a.nome}')" class="bg-pink-100 text-pink-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-pink-200">Programar Envio</button>
                </div>
            `).join('');

            document.getElementById('admin-lista-produtos').innerHTML = produtos.map(p => `
                <div class="flex justify-between items-center bg-white p-2 border rounded text-sm">
                    <span>${p.nome} - R$ ${p.preco.toFixed(2)}</span>
                    <div>
                        <button onclick="editarItem('produto', ${p.id})" class="text-blue-600 mr-2">Editar</button>
                        <button onclick="excluirItem('produto', ${p.id})" class="text-red-600">Excluir</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('admin-lista-servicos').innerHTML = servicos.map(s => `
                <div class="flex justify-between items-center bg-white p-2 border rounded text-sm">
                    <span>${s.nome} - R$ ${s.preco.toFixed(2)}</span>
                    <div>
                        <button onclick="editarItem('servico', ${s.id})" class="text-blue-600 mr-2">Editar</button>
                        <button onclick="excluirItem('servico', ${s.id})" class="text-red-600">Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('form-admin').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const tipo = document.getElementById('item-tipo').value;
            const nome = document.getElementById('item-nome').value;
            const preco = parseFloat(document.getElementById('item-preco').value);
            const foto = document.getElementById('item-foto').value;

            const lista = tipo === 'produto' ? produtos : servicos;

            if(id) {
                const item = lista.find(i => i.id == id);
                if(item) { item.nome = nome; item.preco = preco; item.foto = foto; }
            } else {
                const novoId = lista.length > 0 ? Math.max(...lista.map(i => i.id)) + 1 : 1;
                lista.push({id: novoId, nome, preco, foto});
            }

            this.reset();
            document.getElementById('item-id').value = '';
            renderizarTudo();
            alert('Item salvo com sucesso!');
        });

        function excluirItem(tipo, id) {
            if(confirm('Deseja realmente excluir este item?')) {
                if(tipo === 'produto') {
                    produtos = produtos.filter(p => p.id !== id);
                } else {
                    servicos = servicos.filter(s => s.id !== id);
                }
                renderizarTudo();
            }
        }

        function editarItem(tipo, id) {
            const item = (tipo === 'produto' ? produtos : servicos).find(i => i.id === id);
            if(item) {
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-tipo').value = tipo;
                document.getElementById('item-nome').value = item.nome;
                document.getElementById('item-preco').value = item.preco;
                document.getElementById('item-foto').value = item.foto;
                mudarAba('admin');
            }
        }

        document.getElementById('form-aniversariante').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('aniv-nome').value;
            const data = document.getElementById('aniv-data').value;
            aniversariantes.push({nome, data});
            this.reset();
            renderizarTudo();
            alert('Aniversariante cadastrado com sucesso! Você receberá lembretes e opções de kits.');
        });

        function comprarItem(nome, preco) {
            const taxaEntrega = 15.00;
            const total = preco + taxaEntrega;
            alert(`Produto: ${nome}\nValor: R$ ${preco.toFixed(2)}\nTaxa de Entrega: R$ ${taxaEntrega.toFixed(2)}\nTotal a pagar: R$ ${total.toFixed(2)}\nCompra efetuada com os dados de entrega cadastrados!`);
        }

        function agendarServico(nome) {
            alert(`Serviço "${nome}" selecionado para agendamento! Escolha o dia e horário.`);
        }

        function programarPresente(nome) {
            alert(`Abrindo opções de kits de presentes personalizados para ${nome}. O pagamento somará o produto escolhido + taxa de entrega para o dia exato.`);
        }

        renderizarTudo();
    </script>
</body>
</html>
